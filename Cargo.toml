[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri", "vendor/opencascade"]
# parcad-occt statically builds OpenCASCADE, which is minutes on a cold cache.
# Keep it out of the default build so the everyday loop stays fast; build it
# explicitly with `cargo build -p parcad-occt`.
default-members = ["crates/parcad-core", "crates/parcad-cli", "app/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30"
