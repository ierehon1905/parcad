[workspace]
resolver = "2"
members = [
    "crates/*",
    "app/src-tauri",
    "vendor/opencascade",
    "vendor/opencascade-sys",
    "vendor/occt-sys",
]
# parcad-occt statically builds OpenCASCADE, which is minutes on a cold cache.
# Keep it out of the default build so the everyday loop stays fast; build it
# explicitly with `cargo build -p parcad-occt`.
# parcad-eval is in the default set on purpose: it depends on parcad-occt with
# default features, which is the host half only, so it compiles no C++ either.
default-members = [
    "crates/parcad-core",
    "crates/parcad-cli",
    "crates/parcad-eval",
    "app/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30"

# Release is the profile that runs: the corpus, tools/bench-kernel.sh and the
# shipped worker are all measured here, so it is compiled as hard as is worth
# anything and how long that takes is not a consideration.
#
# Measured on a 142k-triangle implicit mesh (eval/scripts/torus.js at depth 9),
# median of 3, because guessing at this is how the -O0 bug survived:
#
#   no LTO, default codegen-units   2396 ms
#   thin LTO, codegen-units = 1     2273 ms
#   fat LTO,  codegen-units = 1     2299 ms
#
# thin and fat are the same number to within noise, and thin links the worker in
# 2.9 min against fat's 7. The B-rep path does not move at all either way — that
# work is inside OpenCASCADE's C++, which cmake compiles at -O2 and Rust's LTO
# never sees. Swapping thin for fat is one word if that ever stops being true.
[profile.release]
lto = "thin"
codegen-units = 1

# Dev is the profile that compiles: cargo's defaults, incremental, unoptimised.
#
# The test profile inherits it and would therefore run unoptimised too, which
# here means the unit tests take 5.4 s to *execute* rather than 0.06 s — they
# are SDF evaluation and meshing, not plumbing. opt-level 2 buys that back and
# stays incremental, which is what makes `tools/check.sh --fast` sub-second.
[profile.test]
opt-level = 2
