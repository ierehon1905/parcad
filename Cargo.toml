[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri", "vendor/opencascade"]
# parcad-occt statically builds OpenCASCADE, which is minutes on a cold cache.
# Keep it out of the default build so the everyday loop stays fast; build it
# explicitly with `cargo build -p parcad-occt`.
# parcad-eval is in the default set on purpose: it depends on parcad-occt with
# default features, which is the host half only, so it compiles no C++ either.
default-members = [
    "crates/parcad-core",
    "crates/parcad-cli",
    "crates/parcad-eval",
    "app/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30"

# Release is the one that runs: the corpus, tools/bench-kernel.sh and the shipped
# worker are all measured here, so it is compiled as hard as cargo can, and how
# long that takes is not a consideration.
[profile.release]
lto = false

# Dev is the one that compiles: default opt-level, incremental, no LTO.

# The test profile inherits dev and would therefore run unoptimised — which for
# this codebase means the unit tests take 5.4 s to *execute* rather than 0.06 s,
# because they are SDF evaluation and meshing rather than plumbing. opt-level 2
# buys that back while staying incremental, which is what makes tools/check.sh
# --fast a sub-second loop.
[profile.test]
opt-level = 2
