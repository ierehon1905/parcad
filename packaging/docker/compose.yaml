# The hosted server as it runs on a box: the published image, the parts on a
# named volume, the tokens file beside this file, the port on loopback only
# (the TLS front, cloudflared, is on the host). docs/HOSTING.md, "Deploying".
#
#   PARCAD_PUBLIC_HOST=cad.example.com docker compose up -d
#
# PARCAD_VERSION picks the image; PARCAD_TOKENS the tokens file (./tokens);
# PARCAD_BUILDS the builds in flight across every account (2, for a 2 vCPU /
# 4 GB box). To run a build of this checkout instead, build the image with
# `docker build` as packaging/docker/README.md says and set PARCAD_IMAGE to it.
name: parcad

services:
  parcad:
    image: ${PARCAD_IMAGE:-ghcr.io/ierehon1905/parcad:${PARCAD_VERSION:-0.0.14}}
    container_name: parcad
    platform: linux/amd64
    environment:
      PARCAD_PUBLIC_HOST: ${PARCAD_PUBLIC_HOST:?the name clients reach the server by, e.g. cad.example.com}
      PARCAD_BUILDS: ${PARCAD_BUILDS:-2}
      PARCAD_LINK_LIFETIME: ${PARCAD_LINK_LIFETIME:-86400}
      # Behind the sign-in edge (edge/README.md): its public key and the origin name.
      PARCAD_EDGE_KEY: ${PARCAD_EDGE_KEY:-}
      PARCAD_EDGE_ORIGIN: ${PARCAD_EDGE_ORIGIN:-}
      PARCAD_REVOKED: ${PARCAD_REVOKED:-}
      # Daily totals, no account id: /data/stats unless set; off keeps none.
      PARCAD_STATS_DIR: ${PARCAD_STATS_DIR:-}
    ports:
      - "127.0.0.1:4242:4242"
    volumes:
      - parcad-data:/data
      - ${PARCAD_TOKENS:-./tokens}:/etc/parcad/tokens:ro
    # The whole container's memory, leaving the box 1 GB for itself and
    # cloudflared; the host gives each worker this less 1 GB, shared among
    # PARCAD_BUILDS. Per-account limits are PARCAD_LIMIT_<NAME> variables here.
    # docs/HOSTING.md, "Sizing" and "Limits".
    mem_limit: 3g
    memswap_limit: 3g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  parcad-data:
