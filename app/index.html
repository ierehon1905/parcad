<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParCAD</title>
    <!-- A browser here is the same application as the desktop window, so it
         carries the same mark, and the same set as parcad.dev. All of it is
         generated by tools/make-icons.sh from app/src-tauri/icons/favicon.svg. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <!-- The whole window is rendered by src/app.tsx. Two things inside it are
         still imperative and have to be: CodeMirror and three.js each own their
         own DOM, and a virtual DOM must not touch either. -->
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
