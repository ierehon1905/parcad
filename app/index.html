<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParCAD</title>
    <!-- A browser here is the same application as the desktop window, so it
         carries the same mark. The SVG is the favicon itself rather than a
         source for one; the PNG is for browsers that still refuse it. Both are
         generated by tools/make-icons.sh — see app/src-tauri/icons/icon.svg. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- The whole window is rendered by src/app.tsx. Two things inside it are
         still imperative and have to be: CodeMirror and three.js each own their
         own DOM, and a virtual DOM must not touch either. -->
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
