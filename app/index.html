<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>parcad</title>
  </head>
  <body>
    <div id="app" class="flex flex-col">
      <header
        id="titlebar"
        class="flex flex-none items-center gap-3 h-10 px-3.5 bg-panel border-b border-line"
      >
        <span class="font-semibold tracking-[0.02em]">parcad</span>
        <span class="w-px h-[18px] bg-line"></span>
        <!-- The part on screen, and the way to every other one. The picker is
             built in src/project-browser.ts, which reads the shared project
             folder rather than anything compiled in. -->
        <button
          id="project"
          type="button"
          title="Browse parts (⌘O)"
          class="flex items-center gap-2 max-w-[260px] px-2.5 py-1 bg-panel-2 text-ink
                 border border-line rounded-md cursor-pointer hover:border-accent"
        >
          <span id="project-name" class="overflow-hidden text-ellipsis whitespace-nowrap">
            loading…
          </span>
          <span class="text-ink-dim text-[10px]">▾</span>
        </button>
        <!-- Unsaved is the state worth marking, so it is the one main.ts
             colours; disabled means there is nothing to write. -->
        <button
          id="save"
          type="button"
          title="Save this part (⌘S)"
          disabled
          class="flex items-center gap-2 px-2.5 py-1 bg-panel-2 border border-line rounded-md
                 font-mono text-small cursor-pointer
                 disabled:opacity-55 disabled:cursor-default
                 enabled:text-accent enabled:border-accent-deep
                 enabled:hover:border-accent"
        >
          save
        </button>
        <select id="backend" title="Which geometry kernel evaluates the graph">
          <option value="brep">B-rep solid</option>
          <option value="preview">mesh preview</option>
        </select>
        <label
          id="quality"
          class="flex items-center gap-2 text-ink-dim aria-disabled:opacity-45"
        >
          detail
          <input id="depth" type="range" min="4" max="8" step="1" value="7" class="w-[90px] p-0" />
          <span id="depth-value" class="font-mono text-ink min-w-[1ch]">7</span>
        </label>
        <!-- Cutting the part open. The same plane the agent asks for through
             evaluate_part's `section`; the slider is only a faster way to say
             where. -->
        <label
          class="flex items-center gap-2 text-ink-dim [&_:disabled]:opacity-40"
          title="Cut the part open on a plane"
        >
          section
          <select id="section-axis">
            <option value="">off</option>
            <option value="x">X</option>
            <option value="y">Y</option>
            <option value="z">Z</option>
          </select>
          <input id="section-at" type="range" step="0.1" value="0" disabled class="w-[110px] p-0" />
          <!-- Holds its width as the slider moves, so nothing beside it
               shuffles sideways while you drag. -->
          <span id="section-at-value" class="font-mono text-ink min-w-[7ch] text-right"></span>
          <button
            id="section-flip"
            type="button"
            title="Keep the other half"
            disabled
            class="px-1.5 py-0.5 bg-panel-2 border border-line rounded cursor-pointer"
          >
            flip
          </button>
        </label>
        <span class="flex-1"></span>
        <!-- Whether a model is on the MCP endpoint. It edits the same project
             folder as this window and is otherwise invisible from here. The
             leading dot and the colour are set by main.ts. -->
        <span
          id="mcp"
          hidden
          class="flex items-center gap-1.5 mr-3.5 font-mono text-small text-ink-dim cursor-default
                 before:content-[''] before:size-[7px] before:rounded-full
                 before:bg-current before:opacity-50"
        ></span>
        <span id="status" class="font-mono text-small text-ink-dim">ready</span>
      </header>

      <main class="flex flex-1 min-h-0">
        <section
          id="editor-pane"
          class="flex flex-col w-[42%] min-w-[280px] min-h-0 bg-panel"
        >
          <div id="editor" class="flex-1 min-h-0 overflow-hidden"></div>
          <div
            id="error"
            hidden
            class="flex-none max-h-[34%] overflow-auto px-3 py-2.5 border-t border-line
                   bg-bad-bg text-bad-ink font-mono text-tiny whitespace-pre-wrap"
          ></div>
        </section>

        <div id="splitter" class="flex-none w-px bg-line cursor-col-resize hover:bg-accent"></div>

        <section id="viewport-pane" class="relative flex-1 min-w-0">
          <div id="viewport" class="absolute inset-0"></div>
          <div
            id="edge-inspector"
            hidden
            class="absolute top-3.5 right-3.5 min-w-[184px] px-2.5 py-2 rounded-lg
                   border border-line bg-glass/86 backdrop-blur-lg
                   text-ink-dim font-mono text-tiny"
          >
            <div id="entity-inspector-title" class="font-sans text-[10px] leading-[1.3] tracking-[0.08em] uppercase text-ink-dim">edge inspector</div>
            <div id="edge-id" class="mt-0.5 text-ink"></div>
            <div id="edge-detail"></div>
            <div id="edge-origin" hidden class="mt-[5px] text-gold"></div>
            <div id="edge-selector" class="mt-[5px] text-accent"></div>
            <button
              id="copy-edge-selector"
              type="button"
              disabled
              class="mt-[7px] px-1.5 py-0.5 bg-panel-2 text-ink border border-line rounded
                     cursor-pointer disabled:cursor-default disabled:text-ink-dim
                     disabled:opacity-65"
            >
              copy selector
            </button>
          </div>
          <!-- Gold, because it is a *source* selection: what the caret's
               treatment resolves to, drawn over the finished part. -->
          <div
            id="target-preview"
            hidden
            class="absolute top-3.5 left-3.5 px-2.5 py-2 rounded-lg border border-gold-edge
                   bg-glass/86 backdrop-blur-lg text-gold font-mono text-tiny
                   pointer-events-none"
          >
            <div class="font-sans text-[10px] leading-[1.3] tracking-[0.08em] uppercase text-ink-dim">source target</div>
            <div id="target-preview-name"></div>
            <div id="target-preview-detail" class="text-ink-dim"></div>
          </div>
<!-- Hidden until there is something measured to put in it: the border and
               backdrop are visible even with no text, and an empty panel over an
               empty viewport reads as a part that failed to draw. -->
          <div
            id="report"
            hidden
            class="absolute left-3.5 bottom-3.5 max-w-[60%] px-3 py-2.5 rounded-lg
                   border border-line bg-glass/82 backdrop-blur-lg
                   text-ink-dim font-mono text-tiny leading-[1.7] pointer-events-none
                   [&_b]:text-ink [&_b]:font-medium"
          ></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
