<!--
  The desktop app's icon: favicon.svg, which is the mark and the only drawing,
  framed as a macOS tile with the platform's margin and corner. Edit the mark
  there; tools/make-icons.sh renders this. Never edit the PNGs.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile">
      <rect x="80" y="80" width="864" height="864" rx="194"/>
    </clipPath>
  </defs>
  <image clip-path="url(#tile)" x="80" y="80" width="864" height="864" xlink:href="favicon.svg"/>
  <rect x="80.5" y="80.5" width="863" height="863" rx="193.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
</svg>
