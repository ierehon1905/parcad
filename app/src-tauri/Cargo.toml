[package]
name = "parcad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "parcad desktop application"

[lib]
name = "parcad_app_lib"
# rlib only: staticlib and cdylib are mobile-only and each cost a full LTO link (docs/GOTCHAS.md).
crate-type = ["rlib"]

[features]
# The embedded WebDriver server belongs only in the debug binary that the
# desktop regression suite launches. Production builds cannot expose it.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Everything the app can do, and the HTTP and MCP hosts, live there; this crate
# is the window and the IPC adapter onto them. `parcad serve` in the CLI is the
# other embedder of the same crate.
parcad-host = { path = "../../crates/parcad-host" }
parcad-occt = { path = "../../crates/parcad-occt" }
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
# `sync` is for reading the session broadcast the host crate emits.
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
serde_json.workspace = true
base64 = "0.22"
tauri-plugin-updater = "2"
