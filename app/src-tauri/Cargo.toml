[package]
name = "parcad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "parcad desktop application"

[lib]
name = "parcad_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The embedded WebDriver server belongs only in the debug binary that the
# desktop regression suite launches. Production builds cannot expose it.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
parcad-core = { path = "../../crates/parcad-core" }
# Default features only: this pulls in the host half, which spawns a worker and
# reads its reply. No OpenCASCADE is linked into the application binary.
parcad-occt = { path = "../../crates/parcad-occt" }
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
# The app hosts its own UI and API on a loopback port so a browser is the same
# application rather than a reduced one. Tauri already runs a tokio reactor;
# only the listener is added here.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", default-features = false, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rmcp = { version = "3.1.0", features = ["server", "transport-streamable-http-server", "macros", "schemars"] }
rquickjs = { version = "0.12.2", features = ["bindgen"] }
schemars = "1.2.2"
# Images travel base64-encoded in an MCP reply; the protocol has no binary frame.
base64 = "0.22"
