<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParCAD part</title>
  </head>
  <!-- The part inside a chat client, built into one file by vite.viewer.config.ts
       and served by the MCP server as the resource ui://parcad/viewer. -->
  <body class="m-0 bg-bg text-ink font-sans">
    <div id="viewport" class="h-[420px] w-full"></div>

    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
