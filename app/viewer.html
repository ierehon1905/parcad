<!doctype html>
<html lang="en" class="h-auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParCAD part</title>
  </head>
  <!-- The part inside a chat client, built into one file by vite.viewer.config.ts
       and served by the MCP server as the resource ui://parcad/viewer. -->
  <!-- Sized by its content, not the frame: the client sizes the frame from what this page reports. -->
  <body class="m-0 h-auto bg-bg text-ink font-sans">
    <div class="relative h-[400px] w-full touch-none">
      <div id="viewport" class="h-full w-full"></div>
      <!-- See-through and the view presets, drawn by controls.tsx once there is a part. -->
      <div id="on-view"></div>
      <!-- Plain markup, so it shows before the packed scripts have unpacked. -->
      <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-bg px-6 text-center text-sm text-ink-dim">
        <div id="spinner" class="size-8 animate-spin rounded-full border-2 border-line border-t-accent"></div>
        <div id="loading-text" class="data-[bad=true]:text-bad">Loading the viewer…</div>
      </div>
    </div>
    <!-- Bodies to show or hide, and a slider per motion: absent for one body that does not move. -->
    <div id="controls"></div>
    <!-- A fixed height: a client may size the frame before the first status arrives. -->
    <div id="status" class="h-7 truncate px-3 text-tiny leading-7 text-ink-dim data-[bad=true]:h-auto data-[bad=true]:whitespace-normal data-[bad=true]:py-2 data-[bad=true]:leading-5 data-[bad=true]:text-bad"></div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
