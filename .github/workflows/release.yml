# Draft a release from a tag: the desktop app and the headless CLI with its
# worker, for Apple silicon, Linux and Windows.
#
# It never publishes. The release is left as a draft for a human to read, check
# the artefacts of, and press the button on — because shipping a binary is what
# triggers the LGPL's relinking obligation, and NOTICE.md records that the
# decision behind it is a deliberate one rather than a side effect of a tag.
#
# The corpus runs against the very worker that gets uploaded, on every platform.
# A release that builds is not the claim; a release whose geometry is still
# measured right is — and OCCT compiled by MSVC or GCC is a different binary from
# the one the corpus was recorded against.
#
# The sidecar is named for the host triple (tools/build-worker.sh), so each
# target has to build on its own runner.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            triple: aarch64-apple-darwin
            # --bundles app, not the default "all". The .dmg step drives Finder
            # over AppleScript to lay out the disk image window, which has no
            # session to talk to on a headless runner.
            bundles: app
          # 22.04 rather than latest: an AppImage and a .deb run on the glibc they
          # were linked against and newer, so the oldest runner reaches furthest.
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: windows-2022
            triple: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.runner }}
    # A cold OpenCASCADE build is ~5 minutes on 14 cores and far longer on a
    # 3-vCPU runner. Generous on purpose; it is here so a hung cmake cannot burn
    # a runner for six hours.
    timeout-minutes: 240
    env:
      # linuxdeploy is itself an AppImage, and a runner has no FUSE to mount it.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # WebKitGTK for the window; libclang for rquickjs's bindgen.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libclang-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.triple }}

      # Only the first release build compiles OpenCASCADE. The key carries the
      # OCCT tree, the patches and the flags, because vendor/occt-sys/build.rs
      # warns that a mismatched prebuilt install links and is silently wrong.
      - name: Restore the OpenCASCADE install
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: occt-prebuilt
          key: occt-${{ matrix.triple }}-${{ hashFiles('vendor/occt-sys/OCCT/adm/cmake/version.cmake', 'vendor/occt-sys/patches/*', 'cmake/occt-toolchain.cmake', 'vendor/occt-sys/build.rs') }}

      - name: Point the build at the cached install
        if: steps.occt.outputs.cache-hit == 'true'
        run: echo "PARCAD_OCCT_PREBUILT=$PWD/occt-prebuilt" >> "$GITHUB_ENV"

      - name: bun install
        run: cd app && bun install --frozen-lockfile

      - name: Build the B-rep worker
        run: tools/build-worker.sh

      # Even when the worker failed: its OCCT install is still an hour of
      # Windows build, and the next attempt should not pay for it again.
      - name: Keep the OpenCASCADE install for the next run
        id: keep
        if: ${{ !cancelled() && steps.occt.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          # lib/, or libd/ from an MSVC build; vendor/occt-sys/build.rs reads either.
          out=$(find target/release/build -type d -path '*occt-sys-*/out' \
                -exec test -d '{}/include' ';' -print | head -1)
          test -n "$out" && ls "$out"/lib*/*TKernel* >/dev/null 2>&1 \
            || { echo "no finished occt-sys install found" >&2; exit 1; }
          mkdir -p occt-prebuilt
          cp -R "$out"/lib* "$out/include" occt-prebuilt/
          # build-worker.sh proves -O2 took effect by reading a flags.make under
          # the install's build tree. Carry those, or the check silently skips
          # and the -O0 bug in docs/GOTCHAS.md comes back invisibly.
          (cd "$out" && find build -name flags.make -path '*TKBO*') | while read -r f; do
            mkdir -p "occt-prebuilt/$(dirname "$f")"
            cp "$out/$f" "occt-prebuilt/$f"
          done
          du -sh occt-prebuilt

      # Saved here rather than by actions/cache's post step, which saves only
      # when the whole job succeeds.
      - name: Save the OpenCASCADE install
        if: ${{ !cancelled() && steps.keep.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: occt-prebuilt
          key: ${{ steps.occt.outputs.cache-primary-key }}

      - name: Measure the geometry this release would ship
        run: cargo run --locked --release -p parcad-eval

      # CLI and app in one cargo invocation; separately they rebuilt 98 crates (docs/GOTCHAS.md).
      - name: Bundle the app
        run: |
          cd app && bun run tauri build --bundles ${{ matrix.bundles }} \
            --config '{"build":{"beforeBuildCommand":"bun run build"}}' \
            -- -p parcad-app -p parcad-cli --locked

      # Asserted, not built: building parcad-cli alone would recompile the host (docs/GOTCHAS.md).
      - name: Check the headless CLI was built with its UI
        run: |
          test -f app/dist/index.html || { echo "app/dist is missing; parcad serve would carry no UI" >&2; exit 1; }
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          test -f "target/release/parcad$exe" || { echo "tauri build did not build parcad-cli" >&2; exit 1; }

      - name: Stage the headless CLI beside its worker
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          out="parcad-cli-${{ matrix.triple }}"
          for f in target/release/parcad$exe target/release/parcad-occt-worker$exe; do
            test -f "$f" || { echo "expected $f to exist by now" >&2; exit 1; }
          done
          mkdir -p "$out/licenses"
          cp target/release/parcad$exe target/release/parcad-occt-worker$exe "$out/"
          # The Homebrew formula seeds the project folder from these.
          cp -R examples "$out/examples"
          cp LICENSE-MIT LICENSE-APACHE NOTICE.md "$out/licenses/"
          cp vendor/occt-sys/OCCT/LICENSE_LGPL_21.txt \
             vendor/occt-sys/OCCT/OCCT_LGPL_EXCEPTION.txt \
             vendor/opencascade/LICENSE "$out/licenses/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$out.zip" "$out" > /dev/null
          else
            tar czf "$out.tar.gz" "$out"
          fi

      # The archive, not the build tree: unpacked somewhere else, with no
      # PARCAD_OCCT_WORKER, it has to find its own worker and measure the
      # bracket at the volume eval/cases/bracket.json records.
      - name: Run the staged CLI from outside the build tree
        run: |
          set -euo pipefail
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          name="parcad-cli-${{ matrix.triple }}"
          away="$RUNNER_TEMP/unpacked"
          mkdir -p "$away"
          if [ "$RUNNER_OS" = Windows ]; then 7z x -o"$away" "$name.zip" > /dev/null; else tar xzf "$name.tar.gz" -C "$away"; fi
          cd "$away/$name"
          PARCAD_PROJECTS_DIR="$away/projects" PARCAD_HTTP_PORT=4390 \
            ./parcad$exe call evaluate_part --set script=@examples/bracket.js > reply.json
          jq '{volume_mm3, faces, watertight, backend}' reply.json
          jq -e '.backend == "brep" and .faces == 22 and .watertight and (.volume_mm3 - 55074.791 | fabs) < 30' reply.json > /dev/null

      # The same files as the tarball plus the plugin's launcher, as an MCP
      # bundle: what Claude Desktop installs and what the MCP Registry lists. The
      # launcher prefers an installed parcad and uses the bundled one last. The registry
      # refuses a bundle whose URL does not contain "mcp", hence the name.
      # The official packer, not zip: `zip` writes directory entries that the
      # mcpb unpacker fails on, and the packer validates the manifest too.
      # The launcher is a POSIX shell script, so a Windows bundle starts its own
      # parcad.exe directly and does not look for an installed one.
      - name: Pack the MCP bundle
        run: |
          set -euo pipefail
          staged="parcad-cli-${{ matrix.triple }}"
          bundle="parcad-mcp-${{ matrix.triple }}"
          cp -R "$staged" "$bundle"
          cp app/src-tauri/icons/icon.png "$bundle/"
          case "$RUNNER_OS" in
            Windows)
              jq '.compatibility.platforms = ["win32"]
                  | .server.entry_point = "parcad.exe"
                  | .server.mcp_config = {command: "${__dirname}/parcad.exe", args: ["mcp"],
                                          env: {PARCAD_SEED_DIR: "${__dirname}/examples"}}' \
                packaging/mcpb/manifest.json > "$bundle/manifest.json"
              ;;
            *)
              cp packaging/plugin/scripts/parcad-mcp "$bundle/"
              platform=$([ "$RUNNER_OS" = Linux ] && echo linux || echo darwin)
              jq --arg p "$platform" '.compatibility.platforms = [$p]' \
                packaging/mcpb/manifest.json > "$bundle/manifest.json"
              ;;
          esac
          bunx @anthropic-ai/mcpb@2.1.2 pack "$bundle" "$bundle.mcpb"

      - name: Collect the bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS)
              app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
              test -n "$app" || { echo "no .app was bundled" >&2; exit 1; }
              # The bundle arrives with a linker-embedded signature but no
              # _CodeSignature, and macOS reads that inconsistency as a *damaged*
              # app: the dialog offers only Move to Trash. An ad-hoc signature does
              # not make it trusted — it is still rejected, unsigned and
              # unnotarised — but rejected is the ordinary "unidentified developer"
              # path, which the user can get past. Measured with spctl both ways.
              codesign --force --deep --sign - "$app"
              codesign --verify --deep "$app"
              # ditto, not zip: it preserves the bundle's symlinks and resource forks,
              # and an .app that loses those does not launch.
              ditto -c -k --keepParent "$app" \
                "dist/$(basename "$app" .app)-${{ matrix.triple }}.zip"
              ;;
            Linux)
              cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
              ;;
            Windows)
              cp target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe dist/
              ;;
          esac
          cp parcad-cli-*.tar.gz parcad-cli-*.zip parcad-mcp-*.mcpb dist/ 2>/dev/null || true
          ls parcad-cli-* >/dev/null
          ls -lh dist

      # Last, once the worker is staged: testing parcad-occt without its kernel
      # feature makes cargo delete the worker binary beside the tests, and the
      # corpus then skips every case. See docs/GOTCHAS.md.
      - name: Unit tests
        run: cargo test --locked --release -p parcad-core -p parcad-occt -p parcad-host

      - uses: actions/upload-artifact@v4
        with:
          name: parcad-${{ matrix.triple }}
          path: dist/*

  # Only a tag makes a release. A manual run is a build test: it still produces
  # the same artefacts, downloadable from the run's summary page, but leaves no
  # release behind — there is no version for one to be about.
  draft:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file for every platform, written where the files meet.
      - name: Checksum the artefacts
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          body: |
            **macOS will refuse to open this the first time.** These builds are
            not signed with an Apple Developer ID or notarised. Clear the
            quarantine flag once and it opens normally:

            ```
            xattr -dr com.apple.quarantine /Applications/ParCAD.app
            ```

            **Windows SmartScreen will warn the same way** — the installer is
            unsigned. Choose *More info*, then *Run anyway*.

            On a Mac, Homebrew installs the host instead of the app. An agent
            starts it through `parcad mcp`; run `parcad serve` for the whole
            app in your browser at http://127.0.0.1:4242:

            ```
            brew tap ierehon1905/parcad
            brew trust ierehon1905/parcad
            brew install parcad
            claude mcp add parcad -- parcad mcp
            ```

            ---

            **Experimental.** Measure a part before you machine it.

            | platform | app | headless host |
            |---|---|---|
            | macOS, Apple silicon | `ParCAD-aarch64-apple-darwin.zip` — unzip, drag to Applications | `parcad-cli-aarch64-apple-darwin.tar.gz` |
            | Linux x86_64 | `.deb` or `.AppImage` | `parcad-cli-x86_64-unknown-linux-gnu.tar.gz` |
            | Windows x86_64 | `.msi` or `-setup.exe` | `parcad-cli-x86_64-pc-windows-msvc.zip` |

            A `parcad-cli-*` archive is `parcad serve`, its B-rep worker, the
            seed parts and the licence texts; keep the worker beside `parcad`.
            `parcad-mcp-*.mcpb` is the same host as an MCP bundle, for Claude
            Desktop and the MCP Registry. `SHA256SUMS.txt` checksums all of it.

            Contains LGPL-2.1 and MPL-2.0 components — see NOTICE.md. You may
            replace the OpenCASCADE inside this program with your own build;
            NOTICE.md, "How to use your own OpenCASCADE", says how.
