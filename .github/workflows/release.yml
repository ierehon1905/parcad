# Draft a release from a tag: the desktop app for both Macs, and the headless
# CLI with its worker.
#
# It never publishes. The release is left as a draft for a human to read, check
# the artefacts of, and press the button on — because shipping a binary is what
# triggers the LGPL's relinking obligation, and NOTICE.md records that the
# decision behind it is a deliberate one rather than a side effect of a tag.
#
# The corpus runs against the very worker that gets uploaded. A release that
# builds is not the claim; a release whose geometry is still measured right is.
#
# The sidecar is named for the host triple (tools/build-worker.sh), so each
# architecture has to build on its own runner. Only Apple silicon for now.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only for now. Intel can come back once the pipeline is
          # known-good; debugging both at once doubles a 40-minute feedback loop.
          - runner: macos-14
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # A cold OpenCASCADE build is ~5 minutes on 14 cores and far longer on a
    # 3-vCPU runner. Generous on purpose; it is here so a hung cmake cannot burn
    # a runner for six hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      # Only the first release build compiles OpenCASCADE. The key carries the
      # OCCT tree, the patches and the flags, because vendor/occt-sys/build.rs
      # warns that a mismatched prebuilt install links and is silently wrong.
      - name: Restore the OpenCASCADE install
        id: occt
        uses: actions/cache@v4
        with:
          path: occt-prebuilt
          key: occt-${{ matrix.arch }}-${{ hashFiles('vendor/occt-sys/OCCT/adm/cmake/version.cmake', 'vendor/occt-sys/patches/*', 'cmake/occt-toolchain.cmake', 'vendor/occt-sys/build.rs') }}

      - name: Point the build at the cached install
        if: steps.occt.outputs.cache-hit == 'true'
        run: echo "PARCAD_OCCT_PREBUILT=$PWD/occt-prebuilt" >> "$GITHUB_ENV"

      - name: bun install
        run: cd app && bun install --frozen-lockfile

      - name: Build the B-rep worker
        run: tools/build-worker.sh

      - name: Keep the OpenCASCADE install for the next run
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          out=$(find target/release/build -type d -path '*occt-sys-*/out' \
                -exec test -d '{}/lib' -a -d '{}/include' ';' -print | head -1)
          test -n "$out" || { echo "no finished occt-sys install found" >&2; exit 1; }
          mkdir -p occt-prebuilt
          cp -R "$out/lib" "$out/include" occt-prebuilt/
          # build-worker.sh proves -O2 took effect by reading a flags.make under
          # the install's build tree. Carry those, or the check silently skips
          # and the -O0 bug in docs/GOTCHAS.md comes back invisibly.
          (cd "$out" && find build -name flags.make -path '*TKBO*') | while read -r f; do
            mkdir -p "occt-prebuilt/$(dirname "$f")"
            cp "$out/$f" "occt-prebuilt/$f"
          done
          du -sh occt-prebuilt

      - name: Measure the geometry this release would ship
        run: cargo run --locked --release -p parcad-eval

      # --bundles app, not the default "all". The .dmg step drives Finder over
      # AppleScript to lay out the disk image window, which has no session to
      # talk to on a headless runner; the .app itself builds fine. A zipped .app
      # is dragged to Applications exactly the same way.
      - name: Bundle the app
        run: cd app && bun run tauri build --bundles app

      # `tauri build` already built it: its beforeBuildCommand builds the CLI
      # right after app/dist, which the CLI embeds so `parcad serve` carries the
      # UI, and the app bundle carries that same binary. This asserts both.
      - name: Build the headless CLI
        run: |
          test -f app/dist/index.html || { echo "app/dist is missing; parcad serve would carry no UI" >&2; exit 1; }
          cargo build --locked --release -p parcad-cli

      - name: Stage the headless CLI beside its worker
        run: |
          set -euo pipefail
          out="parcad-cli-${{ matrix.arch }}-apple-darwin"
          for f in target/release/parcad target/release/parcad-occt-worker; do
            test -f "$f" || { echo "expected $f to exist by now" >&2; exit 1; }
          done
          mkdir -p "$out/licenses"
          cp target/release/parcad target/release/parcad-occt-worker "$out/"
          # The Homebrew formula seeds the project folder from these.
          cp -R examples "$out/examples"
          cp LICENSE-MIT LICENSE-APACHE NOTICE.md "$out/licenses/"
          cp vendor/occt-sys/OCCT/LICENSE_LGPL_21.txt \
             vendor/occt-sys/OCCT/OCCT_LGPL_EXCEPTION.txt \
             vendor/opencascade/LICENSE "$out/licenses/"
          tar czf "$out.tar.gz" "$out"

      # The same files as the tarball plus the plugin's launcher, as an MCP
      # bundle: what Claude Desktop installs and what the MCP Registry lists. The
      # launcher prefers an installed parcad and uses the bundled one last. The registry
      # refuses a bundle whose URL does not contain "mcp", hence the name.
      # The official packer, not zip: `zip` writes directory entries that the
      # mcpb unpacker fails on, and the packer validates the manifest too.
      - name: Pack the MCP bundle
        run: |
          set -euo pipefail
          staged="parcad-cli-${{ matrix.arch }}-apple-darwin"
          bundle="parcad-mcp-${{ matrix.arch }}-apple-darwin"
          cp -R "$staged" "$bundle"
          cp packaging/mcpb/manifest.json packaging/plugin/scripts/parcad-mcp "$bundle/"
          cp app/src-tauri/icons/icon.png "$bundle/"
          bunx @anthropic-ai/mcpb@2.1.2 pack "$bundle" "$bundle.mcpb"

      - name: Collect the bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no .app was bundled" >&2; exit 1; }
          # The bundle arrives with a linker-embedded signature but no
          # _CodeSignature, and macOS reads that inconsistency as a *damaged*
          # app: the dialog offers only Move to Trash. An ad-hoc signature does
          # not make it trusted — it is still rejected, unsigned and
          # unnotarised — but rejected is the ordinary "unidentified developer"
          # path, which the user can get past. Measured with spctl both ways.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep "$app"
          # ditto, not zip: it preserves the bundle's symlinks and resource forks,
          # and an .app that loses those does not launch.
          ditto -c -k --keepParent "$app" \
            "dist/$(basename "$app" .app)-${{ matrix.arch }}-apple-darwin.zip"
          cp parcad-cli-*.tar.gz parcad-mcp-*.mcpb dist/
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: parcad-${{ matrix.arch }}
          path: dist/*

  # Only a tag makes a release. A manual run is a build test: it still produces
  # the same artefacts, downloadable from the run's summary page, but leaves no
  # release behind — there is no version for one to be about.
  draft:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          body: |
            **macOS will refuse to open this the first time.** These builds are
            not signed with an Apple Developer ID or notarised. Clear the
            quarantine flag once and it opens normally:

            ```
            xattr -dr com.apple.quarantine /Applications/ParCAD.app
            ```

            Homebrew installs the host instead of the app, and nothing on that
            path is quarantined — the whole app is in your browser at
            http://127.0.0.1:4242, MCP at /mcp:

            ```
            brew tap ierehon1905/parcad
            brew trust ierehon1905/parcad
            brew install parcad
            brew services start parcad
            ```

            ---

            **0.0.1, experimental.** Measure a part before you machine it.

            `ParCAD-*.zip` is the app — unzip it and drag it to Applications.
            Apple silicon only. `parcad-cli-*.tar.gz` is what Homebrew installs:
            the headless driver, `parcad serve`, its B-rep worker, the seed
            parts and the licence texts. `parcad-mcp-*.mcpb` is the same
            host as an MCP bundle, for Claude Desktop and the MCP Registry.
            `SHA256SUMS.txt` checksums all three.

            Contains LGPL-2.1 and MPL-2.0 components — see NOTICE.md. You may
            replace the OpenCASCADE inside this program with your own build;
            NOTICE.md, "How to use your own OpenCASCADE", says how.
