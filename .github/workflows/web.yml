# Build ParCAD web and the landing page and publish both at https://parcad.dev:
# the landing page (site/) at the root, and the app with its host and the exact
# kernel compiled to WebAssembly at /app/. They deploy together, as one
# Cloudflare Worker of static files (site/wrangler.toml).
#
# The corpus runs first, against the same WebAssembly build of the worker the
# site's module is linked from, and the site is only built if it passes. Clang
# for wasm32 is a different compiler from the one the corpus was recorded with,
# and a page that measures parts wrong in front of visitors is worse than no
# page. web/README.md has the recipe this follows and what it measured.
#
# The site lived on GitHub Pages at <owner>.github.io/parcad/ until 2026-11; the
# last job keeps a page there that sends every old address to the same path on
# parcad.dev.
#
# Manual only: deploying on every push to main is a decision to make then — add
# `push: branches: [main]`. Needs the secrets CLOUDFLARE_API_TOKEN (Workers
# Scripts edit on the account, Workers Routes edit and Zone read on parcad.dev)
# and CLOUDFLARE_ACCOUNT_ID.
name: web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  EMSDK_VERSION: '6.0.9'

jobs:
  build:
    runs-on: ubuntu-24.04
    # A cold wasm OpenCASCADE is ~5 minutes on 14 cores; a 4-vCPU runner takes
    # several times that. Generous, so a wedged cmake cannot burn six hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler; the wasm target is added to it.
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust target for Emscripten
        run: rustup target add wasm32-unknown-emscripten

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # libclang: bindgen generates the script sandbox's QuickJS bindings for wasm.
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-dev

      - name: Restore the Emscripten SDK
        id: emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      # From the official repository at the pinned tag, never a third-party action.
      - name: Install the Emscripten SDK
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git emsdk
          emsdk/emsdk install "$EMSDK_VERSION"
          emsdk/emsdk activate "$EMSDK_VERSION"

      # The key carries everything the wasm OCCT is built from, for the reason
      # vendor/occt-sys/build.rs gives: a mismatched install links and is wrong.
      - name: Restore the WebAssembly OpenCASCADE
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: target/wasm/occt
          key: occt-wasm-${{ env.EMSDK_VERSION }}-${{ hashFiles('vendor/occt-sys/OCCT/adm/cmake/version.cmake', 'vendor/occt-sys/patches/*', 'cmake/occt-toolchain.cmake', 'web/occt-emscripten.cmake', 'web/build-kernel.sh', 'vendor/opencascade-sys/build.rs') }}

      - name: Build OpenCASCADE for wasm32
        if: steps.occt.outputs.cache-hit != 'true'
        run: EMSDK=$PWD/emsdk web/build-kernel.sh occt

      - name: Keep the WebAssembly OpenCASCADE for the next run
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/wasm/occt
          key: ${{ steps.occt.outputs.cache-primary-key }}

      - name: Build the worker and the browser kernel
        run: EMSDK=$PWD/emsdk web/build-kernel.sh worker

      - name: Build the browser host
        run: EMSDK=$PWD/emsdk web/build-kernel.sh host

      - name: bun install
        run: cd app && bun install --frozen-lockfile

      - name: The corpus, against the WebAssembly build
        # The page's own limit (TIMEOUT_MS in app/src/page/kernel.ts), not the
        # native 20 s: 20-turn thread clearance measured 20 s+ on a 4-vCPU runner.
        env:
          PARCAD_OCCT_TIMEOUT: 60
        run: PARCAD_OCCT_WORKER=$PWD/web/node-worker.sh cargo run --locked -q --release -p parcad-eval

      # PARCAD_RELAY is a repository variable naming the deployed relay
      # (relay/README.md); without it the site builds with no way to connect an agent.
      - name: Build ParCAD web
        env:
          VITE_PARCAD_RELAY: ${{ vars.PARCAD_RELAY }}
        run: |
          cd app && bun x vite build --mode web
          bun x vite build --config vite.viewer.config.ts --outDir dist-web
          du -sh dist-web

      - name: Build the landing page
        run: cd site && bun install --frozen-lockfile && bun run build

      - name: Lay out parcad.dev
        run: site/layout.sh site/build/client app/dist-web site/dist

      - uses: actions/upload-artifact@v4
        with:
          name: parcad.dev
          path: site/dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: parcad.dev
      url: https://parcad.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: parcad.dev
          path: site/dist

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd site && bun install --frozen-lockfile && bun x wrangler deploy

  moved:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The landing page, the app and every other old path on Pages, 404.html included.
      - name: Lay out the forwarding page
        run: |
          mkdir -p _moved/app
          for page in index.html app/index.html 404.html; do cp site/moved.html "_moved/$page"; done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _moved

      - id: deployment
        uses: actions/deploy-pages@v4
