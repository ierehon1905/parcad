[package]
name = "parcad-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kernel-agnostic intent graph, geometry evaluation and perception for parcad"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
nalgebra = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# The 3MF package is a deflated ZIP; both are already in the lockfile, via png.
flate2 = "1.1"
crc32fast = "1.5"
