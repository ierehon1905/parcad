[package]
name = "parcad-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What parcad can do, and the HTTP and MCP hosts that expose it — no window"

[build-dependencies]
serde_json.workspace = true

[dependencies]
parcad-core = { path = "../parcad-core" }
# Default features only: this pulls in the host half, which spawns a worker and
# reads its reply. No OpenCASCADE is linked into a host binary.
parcad-occt = { path = "../parcad-occt" }
parcad-evaluation = { path = "../parcad-evaluation" }
# `rt` is for `spawn_blocking`; `sync` is for the session broadcast channel.
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# The streamable HTTP transport is a tower service, so a browser tab runs the
# same one with the page carrying its requests (`page.rs`).
rmcp = { version = "3.1.0", features = ["server", "transport-streamable-http-server", "macros", "schemars"] }
# What `page.rs` builds a request to that service from, and reads its reply with.
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
rquickjs = { version = "0.12.2", features = ["bindgen"] }
schemars = "1.2.2"
dirs = "6"
# Images travel base64-encoded in an MCP reply; the protocol has no binary frame.
base64 = "0.22"
# open_project and set_script identify the script on screen by its digest
# instead of echoing it.
sha2 = "0.10"
zstd = "0.13"
draco-core = "2.1"

# Hosting on a socket, which a browser tab does not: its host is
# `crates/parcad-wasm-host`, and its transport is the page.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
# The UI and API are hosted on a loopback port so a browser is the same
# application rather than a reduced one. Whoever embeds this crate owns the
# tokio reactor — Tauri runs one, the CLI starts one — and only the listener is
# added here.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", default-features = false, features = ["net"] }
# Adapts a broadcast receiver into the SSE stream browsers watch for session events.
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
